# Fail2ban jail for Traefik dashboard
# Copy this file to /etc/fail2ban/jail.d/ and replace LOGPATH with the
# absolute path to logs/traefik/access.log on the host.

[traefik-dashboard]
enabled = true
port = http,https
filter = traefik-dashboard
logpath = /path/to/eigenstack/logs/traefik/access.log
backend = auto
maxretry = 5
findtime = 600
bantime = 3600
