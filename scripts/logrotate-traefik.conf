# Rotate Traefik access log to prevent unbounded growth.
# Copy to /etc/logrotate.d/traefik-access and replace LOGPATH with the
# absolute path to logs/traefik/access.log on the host.

/path/to/eigenstack/logs/traefik/access.log {
    daily
    rotate 14
    compress
    delaycompress
    missingok
    notifempty
    copytruncate
}
