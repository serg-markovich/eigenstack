# traefik/traefik.yml
# Static configuration — requires restart to apply changes

global:
  checkNewVersion: false
  sendAnonymousUsage: false

api:
  dashboard: true
  insecure: false

log:
  level: INFO

entryPoints:
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          permanent: true
  websecure:
    address: ":443"
    http:
      tls:
        certResolver: le

providers:
  docker:
    endpoint: "unix:///var/run/docker.sock"
    exposedByDefault: false
    network: eigen-web
  file:
    directory: /dynamic/
    watch: true

# --- ACME (Let's Encrypt) Staging ---
# Production will switch to the live ACME server
certificatesResolvers:
  le:
    acme:
      storage: /certs/acme.json
      caServer: https://acme-staging-v02.api.letsencrypt.org/directory
      httpChallenge:
        entryPoint: web